<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小手家务 LittleHands · 打卡</title>
  <meta name="theme-color" content="#fbbf24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小手家务">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-amber-50 min-h-screen pb-36">

  <!-- ======== 顶部：标题 + 家长锁 ======== -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-2 flex items-center justify-between">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-700">🖐️ 小手家务 <span class="text-base sm:text-lg font-bold text-amber-400 align-middle">LittleHands</span></h1>
      <a href="/admin.html" class="px-3 py-2 text-3xl" title="jiā zhǎng hòu tái · 家长后台">🔒</a>
    </div>

    <!-- 今日收益条 -->
    <div class="bg-gradient-to-r from-amber-400 to-orange-400 text-white">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-end justify-between">
        <div>
          <div class="text-sm opacity-90">jīn rì yǐ zhuàn · 今日已赚</div>
          <div class="text-4xl sm:text-5xl font-black leading-tight">¥ <span id="today-total">0</span></div>
        </div>
        <div id="pending-preview" class="text-right hidden">
          <div class="text-sm opacity-90">zhè cì néng zhuàn · 这次能赚</div>
          <div class="text-3xl font-black">+<span id="pending-amount">0</span> 元</div>
        </div>
      </div>
    </div>

    <!-- Tab 导航 -->
    <nav class="max-w-5xl mx-auto flex">
      <a href="#checkin" data-tab="checkin" class="tab">✅ dǎ kǎ · 打卡</a>
      <a href="#bank" data-tab="bank" class="tab">🐷 xiǎo jīn kù · 小金库</a>
    </nav>
  </header>

  <!-- ======== 主内容 ======== -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 py-4">
    <section id="view-checkin">
      <div id="task-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>
      <div id="grid-loading" class="py-16 text-center text-gray-400 text-lg">jiā zǎi zhōng · 加载中…</div>
      <p id="empty-tip" class="hidden text-center text-xl text-gray-400 py-16">家长还没有添加家务哦～</p>
    </section>
    <section id="view-bank" class="hidden">
      <!-- 汇总：累计总收入 + 三小格 -->
      <div class="rounded-3xl bg-gradient-to-br from-pink-400 to-rose-400 text-white p-5 shadow-lg">
        <div class="text-sm opacity-90">lěi jì zǒng shōu rù · 累计总收入</div>
        <div class="text-5xl font-black mt-1">¥ <span id="bank-grand">0</span></div>
        <div class="grid grid-cols-3 gap-2 mt-4 text-center">
          <div class="bg-white/20 rounded-2xl py-2">
            <div class="text-xs opacity-90">jīn rì · 今日</div>
            <div class="text-xl font-extrabold">¥<span id="bank-today">0</span></div>
          </div>
          <div class="bg-white/20 rounded-2xl py-2">
            <div class="text-xs opacity-90">běn yuè · 本月</div>
            <div class="text-xl font-extrabold">¥<span id="bank-month">0</span></div>
          </div>
          <div class="bg-white/20 rounded-2xl py-2">
            <div class="text-xs opacity-90">dǎ kǎ tiān shù · 打卡天数</div>
            <div class="text-xl font-extrabold"><span id="bank-days">0</span> 天</div>
          </div>
        </div>
      </div>

      <!-- 今日明细 -->
      <h2 class="mt-6 mb-2 text-xl font-extrabold text-gray-700">📋 jīn rì míng xì · 今日明细</h2>
      <div id="bank-today-list" class="bg-white rounded-3xl shadow divide-y divide-amber-50 overflow-hidden"></div>

      <!-- 每日打卡记录 -->
      <div class="mt-6 mb-2 flex items-center justify-between">
        <h2 class="text-xl font-extrabold text-gray-700">📅 měi rì jì lù · 每日打卡记录</h2>
        <span class="text-amber-500 font-bold">本月 ¥<span id="bank-hist-month-total">0</span></span>
      </div>
      <div class="flex items-center justify-between bg-white rounded-2xl shadow px-4 py-1.5 mb-3">
        <button id="month-prev" class="w-12 h-12 rounded-full text-3xl font-bold text-pink-500 active:scale-90 transition">‹</button>
        <div id="month-label" class="text-xl font-extrabold text-gray-700"></div>
        <button id="month-next" class="w-12 h-12 rounded-full text-3xl font-bold text-pink-500 active:scale-90 transition disabled:opacity-30">›</button>
      </div>
      <div id="bank-history-list" class="space-y-2 pb-4"></div>
    </section>
  </main>

  <!-- ======== 底部：一键提交 ======== -->
  <div class="fixed bottom-0 inset-x-0 z-30 bg-white/90 backdrop-blur border-t border-amber-100"
       style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <button id="submit-btn" disabled
        class="w-full py-4 rounded-3xl text-2xl font-extrabold text-white bg-emerald-500 shadow-lg
               active:scale-95 transition disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed">
        dǎ kǎ tí jiāo · 打卡提交
      </button>
    </div>
  </div>

  <!-- 悬浮提示与奖励动效 -->
  <div id="toast-root" class="fixed inset-x-0 top-28 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
  <div id="pop-overlay" class="fixed inset-0 z-40 hidden items-center justify-center pointer-events-none">
    <div id="pop-text" class="text-6xl font-black text-emerald-500 drop-shadow-lg"></div>
  </div>

  <script type="module" src="/js/child.js"></script>
</body>
</html>
